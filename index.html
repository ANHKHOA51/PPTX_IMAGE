<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Xử lý PowerPoint</title>
    <style>
        :root {
            --primary-color: #d83b01;
            /* Màu cam PowerPoint */
            --primary-hover: #b83201;
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Khu vực Upload */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            background-color: #fafafa;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 20px;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-area p {
            margin: 0;
            font-weight: bold;
            color: #555;
        }

        /* Danh sách file đã chọn */
        #file-list {
            text-align: left;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }

        #file-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #file-list li {
            background: #f0f0f0;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        /* Nút xử lý */
        .btn-process {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: var(--primary-hover);
        }

        .btn-process:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Khu vực kết quả */
        #result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
            /* Ẩn đi cho đến khi có kết quả */
        }

        #result-area h3 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            margin: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PowerPoint Image Extraction</h1>
        <p class="subtitle">Tải lên một hoặc nhiều file .pptx để bắt đầu</p>

        <div class="upload-area">
            <input type="file" id="fileInput" multiple accept=".pptx">
            <p>📁 Kéo thả file vào đây hoặc Click để chọn file</p>
        </div>

        <div id="file-list"></div>

        <button id="processBtn" class="btn-process" disabled>Xử lý File</button>

        <div id="result-area">
            <h3>Kết quả của bạn:</h3>
            <div id="download-links">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('file-list');
        const processBtn = document.getElementById('processBtn');
        const resultArea = document.getElementById('result-area');
        const downloadLinksContainer = document.getElementById('download-links');

        let selectedFiles = [];
        const EMU_TO_INCH = 914400; // Hằng số quy đổi tọa độ của Microsoft

        // 1. Lắng nghe chọn file
        fileInput.addEventListener('change', function (event) {
            selectedFiles = Array.from(event.target.files);
            fileListContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                const ul = document.createElement('ul');
                selectedFiles.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = `📄 ${file.name}`;
                    ul.appendChild(li);
                });
                fileListContainer.appendChild(ul);
                processBtn.disabled = false;
            } else {
                processBtn.disabled = true;
            }
            resultArea.style.display = 'none';
        });

        // 2. Hàm lõi: Bóc tách hình ảnh và tạo file PPTX mới
        async function processSingleFile(file) {
            const zip = new JSZip();
            const arrayBuffer = await file.arrayBuffer();
            await zip.loadAsync(arrayBuffer);

            const newPptx = new PptxGenJS();
            // Chỉnh lại Layout chuẩn (Fix lỗi UNKNOWN-LAYOUT)
            newPptx.layout = 'LAYOUT_16x9';

            const parser = new DOMParser();

            // Sắp xếp slide đúng thứ tự 1, 2, 3...
            const slideFiles = Object.keys(zip.files).filter(name =>
                name.match(/^ppt\/slides\/slide\d+\.xml$/)
            ).sort((a, b) => {
                return parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]);
            });

            for (let slidePath of slideFiles) {
                let slideNum = slidePath.match(/slide(\d+)\.xml/)[1];
                let slideXmlStr = await zip.file(slidePath).async("string");
                let slideDoc = parser.parseFromString(slideXmlStr, "application/xml");

                let relsPath = `ppt/slides/_rels/slide${slideNum}.xml.rels`;
                let relsDoc = null;
                if (zip.file(relsPath)) {
                    let relsXmlStr = await zip.file(relsPath).async("string");
                    relsDoc = parser.parseFromString(relsXmlStr, "application/xml");
                }

                // CÁCH TÌM ẢNH MỚI: Tìm tất cả các thẻ có chứa "blip" (thẻ định nghĩa ảnh gốc)
                // Cách này sẽ bắt được cả ảnh trong p:pic, ảnh nền, và ảnh trong group
                let blipNodes = slideDoc.getElementsByTagNameNS("*", "blip");
                if (blipNodes.length === 0) blipNodes = slideDoc.getElementsByTagName("a:blip"); // Fallback

                // FIX 1: Nếu slide không có ảnh nào -> Bỏ qua, không tạo slide mới
                if (blipNodes.length === 0) continue;

                // Chỉ khi có ảnh mới tạo slide mới
                let newSlide = newPptx.addSlide();

                for (let i = 0; i < blipNodes.length; i++) {
                    let blip = blipNodes[i];
                    let embedId = blip.getAttribute("r:embed");
                    if (!embedId) continue;

                    // Truy ngược lên để tìm thẻ chứa tọa độ (a:off) và kích thước (a:ext)
                    // Thường nó nằm ở node cha hoặc anh em gần đó.
                    let picNode = blip.parentNode;
                    while (picNode && picNode.nodeName.indexOf("pic") === -1 && picNode.nodeName !== "p:bg") {
                        picNode = picNode.parentNode;
                    }

                    let x = 0, y = 0, w = 4, h = 3; // Kích thước mặc định fallback

                    if (picNode) {
                        let xfrm = picNode.getElementsByTagNameNS("*", "xfrm")[0] || picNode.getElementsByTagName("a:xfrm")[0];
                        if (xfrm) {
                            let off = xfrm.getElementsByTagNameNS("*", "off")[0] || xfrm.getElementsByTagName("a:off")[0];
                            let ext = xfrm.getElementsByTagNameNS("*", "ext")[0] || xfrm.getElementsByTagName("a:ext")[0];

                            if (off && ext) {
                                // FIX 3: Quy đổi chính xác từ EMU sang Inch (1 Inch = 914400 EMU)
                                x = parseInt(off.getAttribute("x") || 0) / 914400;
                                y = parseInt(off.getAttribute("y") || 0) / 914400;
                                w = parseInt(ext.getAttribute("cx") || 0) / 914400;
                                h = parseInt(ext.getAttribute("cy") || 0) / 914400;
                            }
                        }
                    }

                    // Đối chiếu ID để lấy ảnh từ file .rels
                    if (relsDoc) {
                        let relationships = relsDoc.getElementsByTagName("Relationship");
                        let imagePathInZip = null;

                        for (let j = 0; j < relationships.length; j++) {
                            if (relationships[j].getAttribute("Id") === embedId) {
                                let target = relationships[j].getAttribute("Target");
                                imagePathInZip = target.replace('../', 'ppt/');
                                break;
                            }
                        }

                        if (imagePathInZip && zip.file(imagePathInZip)) {
                            let extMatch = imagePathInZip.match(/\.([^.]+)$/);
                            let imgExt = extMatch ? extMatch[1].toLowerCase() : 'png';

                            // Xử lý một số định dạng ngoại lệ
                            if (imgExt === 'jpeg') imgExt = 'jpg';

                            let base64Data = await zip.file(imagePathInZip).async("base64");
                            let dataUrl = `image/${imgExt};base64,${base64Data}`;

                            // Thêm ảnh vào slide với tọa độ vừa bóc
                            newSlide.addImage({
                                data: dataUrl,
                                x: x, y: y, w: w, h: h
                            });
                        }
                    }
                }
            }

            return await newPptx.write({ outputType: 'blob' });
        }

        // 3. Xử lý khi bấm nút
        processBtn.addEventListener('click', async function () {
            processBtn.textContent = 'Đang xử lý...';
            processBtn.disabled = true;
            downloadLinksContainer.innerHTML = '';

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    let file = selectedFiles[i];

                    // Gọi hàm bóc tách cho từng file
                    let resultBlob = await processSingleFile(file);

                    // Tạo link download
                    const url = URL.createObjectURL(resultBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    // Thêm tiền tố để phân biệt với file gốc
                    a.download = `ImagesOnly_${file.name}`;
                    a.className = 'download-btn';
                    a.textContent = `Tải về: ImagesOnly_${file.name}`;
                    downloadLinksContainer.appendChild(a);
                }

                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Có lỗi xảy ra trong quá trình bóc tách hình ảnh!");
            } finally {
                processBtn.textContent = 'Xử lý File';
                processBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
