<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Xử lý PowerPoint</title>
    <style>
        :root {
            --primary-color: #d83b01;
            /* Màu cam PowerPoint */
            --primary-hover: #b83201;
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Khu vực Upload */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            background-color: #fafafa;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 20px;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-area p {
            margin: 0;
            font-weight: bold;
            color: #555;
        }

        /* Danh sách file đã chọn */
        #file-list {
            text-align: left;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }

        #file-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #file-list li {
            background: #f0f0f0;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        /* Nút xử lý */
        .btn-process {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: var(--primary-hover);
        }

        .btn-process:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Khu vực kết quả */
        #result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
            /* Ẩn đi cho đến khi có kết quả */
        }

        #result-area h3 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            margin: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PowerPoint Image Extraction</h1>
        <p class="subtitle">Tải lên một hoặc nhiều file .pptx để bắt đầu</p>

        <div class="upload-area">
            <input type="file" id="fileInput" multiple accept=".pptx">
            <p>📁 Kéo thả file vào đây hoặc Click để chọn file</p>
        </div>

        <div id="file-list"></div>

        <button id="processBtn" class="btn-process" disabled>Xử lý File</button>

        <div id="result-area">
            <h3>Kết quả của bạn:</h3>
            <div id="download-links">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('file-list');
        const processBtn = document.getElementById('processBtn');
        const resultArea = document.getElementById('result-area');
        const downloadLinksContainer = document.getElementById('download-links');

        let selectedFiles = [];
        const EMU_TO_INCH = 914400; // Hằng số quy đổi tọa độ của Microsoft

        // 1. Lắng nghe chọn file
        fileInput.addEventListener('change', function (event) {
            selectedFiles = Array.from(event.target.files);
            fileListContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                const ul = document.createElement('ul');
                selectedFiles.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = `📄 ${file.name}`;
                    ul.appendChild(li);
                });
                fileListContainer.appendChild(ul);
                processBtn.disabled = false;
            } else {
                processBtn.disabled = true;
            }
            resultArea.style.display = 'none';
        });

        // Chỉ cần dùng JSZip, KHÔNG cần PptxGenJS nữa
        async function processSingleFile(file) {
            const zip = new JSZip();
            const arrayBuffer = await file.arrayBuffer();
            await zip.loadAsync(arrayBuffer);

            const parser = new DOMParser();
            const serializer = new XMLSerializer();

            const PRES_NS = "http://schemas.openxmlformats.org/presentationml/2006/main";
            const A_NS = "http://schemas.openxmlformats.org/drawingml/2006/main";

            let presXmlStr = await zip.file("ppt/presentation.xml").async("string");
            let presDoc = parser.parseFromString(presXmlStr, "application/xml");

            let presRelsStr = await zip.file("ppt/_rels/presentation.xml.rels").async("string");
            let presRelsDoc = parser.parseFromString(presRelsStr, "application/xml");

            let contentTypesStr = await zip.file("[Content_Types].xml").async("string");
            let contentTypesDoc = parser.parseFromString(contentTypesStr, "application/xml");

            const slideFiles = Object.keys(zip.files).filter(name =>
                /^ppt\/slides\/slide\d+\.xml$/.test(name)
            );

            const layoutFiles = Object.keys(zip.files).filter(name =>
                /^ppt\/slideLayouts\/slideLayout\d+\.xml$/.test(name)
            );

            const masterFiles = Object.keys(zip.files).filter(name =>
                /^ppt\/slideMasters\/slideMaster\d+\.xml$/.test(name)
            );

            function getFirstByLocalName(doc, localName) {
                return doc.getElementsByTagNameNS("*", localName)[0] || null;
            }

            function removeAllChildrenExcept(node, keepLocalNames) {
                const children = Array.from(node.childNodes || []);
                for (const child of children) {
                    if (child.nodeType !== 1) continue;
                    if (!keepLocalNames.includes(child.localName)) {
                        node.removeChild(child);
                    }
                }
            }

            function setWhiteBackground(doc) {
                const cSld = getFirstByLocalName(doc, "cSld");
                if (!cSld) return;

                // Xoá background cũ nếu có
                let oldBg = getFirstByLocalName(cSld, "bg");
                if (oldBg) cSld.removeChild(oldBg);

                // Tạo background trắng mới
                const whiteBgXml = `
            <p:bg xmlns:a="${A_NS}" xmlns:p="${PRES_NS}">
                <p:bgPr>
                    <a:solidFill>
                        <a:srgbClr val="FFFFFF"/>
                    </a:solidFill>
                    <a:effectLst/>
                </p:bgPr>
            </p:bg>
        `;
                const newBgDoc = parser.parseFromString(whiteBgXml, "application/xml");
                const importedBgNode = doc.importNode(newBgDoc.documentElement, true);
                cSld.insertBefore(importedBgNode, cSld.firstChild);
            }

            function hideMasterAndWhiteSlide(slideDoc) {
                const root = slideDoc.documentElement;

                // Ẩn các shape từ master
                root.setAttribute("showMasterSp", "0");
                root.setAttribute("showMasterPhAnim", "0");

                setWhiteBackground(slideDoc);
            }

            function slideHasRealPicture(slideDoc) {
                // 1. Kiểm tra ảnh thường
                const pics = Array.from(slideDoc.getElementsByTagNameNS("*", "pic"));
                if (pics.length > 0) return true;

                // 2. Kiểm tra ảnh nhét trong hình khối/khung (ngoại trừ ảnh nền)
                const blipFills = Array.from(slideDoc.getElementsByTagNameNS("*", "blipFill"));
                for (const bf of blipFills) {
                    let curr = bf.parentNode;
                    let isBackground = false;
                    while (curr) {
                        if (curr.localName === "bg") {
                            isBackground = true;
                            break;
                        }
                        curr = curr.parentNode;
                    }
                    if (!isBackground) return true; // Có ảnh thật!
                }
                return false;
            }

            function cleanSlideContent(slideDoc) {
                // Chỉ sử dụng logic Black-list (tìm đúng đồ thừa thì xóa), để tránh xóa nhầm Shape chứa ảnh

                const shapes = Array.from(slideDoc.getElementsByTagNameNS("*", "sp"));
                for (const shape of shapes) {
                    const hasPic = shape.getElementsByTagNameNS("*", "blipFill").length > 0;
                    if (!hasPic) {
                        shape.parentNode && shape.parentNode.removeChild(shape);
                    }
                }

                const graphicFrames = Array.from(slideDoc.getElementsByTagNameNS("*", "graphicFrame"));
                for (const g of graphicFrames) {
                    // Kiểm tra xem bên trong có chứa ảnh OLE (Word/Excel) không
                    const hasPic = g.getElementsByTagNameNS("*", "blip").length > 0;
                    if (!hasPic) {
                        g.parentNode && g.parentNode.removeChild(g);
                    }
                }

                const connectors = Array.from(slideDoc.getElementsByTagNameNS("*", "cxnSp"));
                for (const c of connectors) {
                    c.parentNode && c.parentNode.removeChild(c);
                }

                const inks = Array.from(slideDoc.getElementsByTagNameNS("*", "ink"));
                for (const ink of inks) {
                    ink.parentNode && ink.parentNode.removeChild(ink);
                }

                const oleObjs = Array.from(slideDoc.getElementsByTagNameNS("*", "oleObj"));
                for (const o of oleObjs) {
                    o.parentNode && o.parentNode.removeChild(o);
                }

                // Cuối cùng là ẩn master và ép nền trắng
                hideMasterAndWhiteSlide(slideDoc);
            }

            function cleanMasterOrLayout(doc) {
                const cSld = getFirstByLocalName(doc, "cSld");
                if (!cSld) return;

                const spTree = getFirstByLocalName(cSld, "spTree");
                if (!spTree) return;

                // Xoá mọi thứ trong master/layout để bỏ logo/template/background cũ
                // Chỉ giữ node khung bắt buộc
                removeAllChildrenExcept(spTree, ["nvGrpSpPr", "grpSpPr"]);

                // Xoá background cũ
                let oldBg = getFirstByLocalName(cSld, "bg");
                if (oldBg) cSld.removeChild(oldBg);

                // Ép nền trắng
                setWhiteBackground(doc);
            }

            // =========================================================
            // PASS 1: đọc tất cả slide và đánh dấu slide nào thật sự có ảnh
            // =========================================================
            const slideDocs = new Map();
            const slidesToDelete = new Set();

            for (const slidePath of slideFiles) {
                const slideXmlStr = await zip.file(slidePath).async("string");
                const slideDoc = parser.parseFromString(slideXmlStr, "application/xml");
                slideDocs.set(slidePath, slideDoc);

                if (!slideHasRealPicture(slideDoc)) {
                    slidesToDelete.add(slidePath);
                }
            }

            // =========================================================
            // PASS 2: xử lý slide còn lại
            // =========================================================
            for (const slidePath of slideFiles) {
                if (slidesToDelete.has(slidePath)) continue;

                const slideDoc = slideDocs.get(slidePath);
                cleanSlideContent(slideDoc);

                zip.file(slidePath, serializer.serializeToString(slideDoc));
            }

            // =========================================================
            // PASS 3: xóa slide trống khỏi presentation.xml + rels + content types
            // =========================================================
            for (const slidePath of slidesToDelete) {
                const slideFileName = slidePath.split("/").pop();

                // Xoá relationship trong presentation.xml.rels
                const rels = Array.from(presRelsDoc.getElementsByTagNameNS("*", "Relationship"));
                let removedRId = null;

                for (const rel of rels) {
                    const target = rel.getAttribute("Target") || "";
                    if (
                        target === `slides/${slideFileName}` ||
                        target.endsWith(`/${slideFileName}`) ||
                        target === slideFileName ||
                        target.includes(slideFileName)
                    ) {
                        removedRId = rel.getAttribute("Id");
                        rel.parentNode && rel.parentNode.removeChild(rel);
                        break;
                    }
                }

                // Xoá sldId trong presentation.xml
                if (removedRId) {
                    const sldIds = Array.from(presDoc.getElementsByTagNameNS("*", "sldId"));
                    for (const sldId of sldIds) {
                        const attrs = Array.from(sldId.attributes || []);
                        const match = attrs.some(attr => attr.value === removedRId);
                        if (match) {
                            sldId.parentNode && sldId.parentNode.removeChild(sldId);
                            break;
                        }
                    }
                }

                // Xoá override trong [Content_Types].xml
                const overrides = Array.from(contentTypesDoc.getElementsByTagNameNS("*", "Override"));
                for (const override of overrides) {
                    const partName = override.getAttribute("PartName") || "";
                    if (partName.includes(`/slides/${slideFileName}`)) {
                        override.parentNode && override.parentNode.removeChild(override);
                        break;
                    }
                }

                // Xoá file slide và rels
                zip.remove(slidePath);
                zip.remove(`ppt/slides/_rels/${slideFileName}.rels`);
            }

            // =========================================================
            // PASS 4: xoá logo/template từ slideLayout và slideMaster
            // =========================================================
            for (const layoutPath of layoutFiles) {
                const xmlStr = await zip.file(layoutPath).async("string");
                const doc = parser.parseFromString(xmlStr, "application/xml");
                cleanMasterOrLayout(doc);
                zip.file(layoutPath, serializer.serializeToString(doc));
            }

            for (const masterPath of masterFiles) {
                const xmlStr = await zip.file(masterPath).async("string");
                const doc = parser.parseFromString(xmlStr, "application/xml");
                cleanMasterOrLayout(doc);
                zip.file(masterPath, serializer.serializeToString(doc));
            }

            // =========================================================
            // SAVE ROOT FILES
            // =========================================================
            zip.file("ppt/presentation.xml", serializer.serializeToString(presDoc));
            zip.file("ppt/_rels/presentation.xml.rels", serializer.serializeToString(presRelsDoc));
            zip.file("[Content_Types].xml", serializer.serializeToString(contentTypesDoc));

            return await zip.generateAsync({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
            });
        }

        // 3. Xử lý khi bấm nút
        processBtn.addEventListener('click', async function () {
            processBtn.textContent = 'Đang xử lý...';
            processBtn.disabled = true;
            downloadLinksContainer.innerHTML = '';

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    let file = selectedFiles[i];

                    // Gọi hàm bóc tách cho từng file
                    let resultBlob = await processSingleFile(file);

                    // Tạo link download
                    const url = URL.createObjectURL(resultBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    // Thêm tiền tố để phân biệt với file gốc
                    a.download = `Images_${file.name}`;
                    a.className = 'download-btn';
                    a.textContent = `Tải về: Images_${file.name}`;
                    downloadLinksContainer.appendChild(a);
                }

                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Có lỗi xảy ra trong quá trình bóc tách hình ảnh!");
            } finally {
                processBtn.textContent = 'Xử lý File';
                processBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
