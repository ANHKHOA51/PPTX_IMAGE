<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Xử lý PowerPoint</title>
    <style>
        :root {
            --primary-color: #d83b01;
            /* Màu cam PowerPoint */
            --primary-hover: #b83201;
            --bg-color: #f4f6f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Khu vực Upload */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            background-color: #fafafa;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 20px;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-area p {
            margin: 0;
            font-weight: bold;
            color: #555;
        }

        /* Danh sách file đã chọn */
        #file-list {
            text-align: left;
            margin-bottom: 20px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 14px;
        }

        #file-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        #file-list li {
            background: #f0f0f0;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        /* Nút xử lý */
        .btn-process {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-process:hover {
            background-color: var(--primary-hover);
        }

        .btn-process:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Khu vực kết quả */
        #result-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: none;
            /* Ẩn đi cho đến khi có kết quả */
        }

        #result-area h3 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .download-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            margin: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>PowerPoint Image Extraction</h1>
        <p class="subtitle">Tải lên một hoặc nhiều file .pptx để bắt đầu</p>

        <div class="upload-area">
            <input type="file" id="fileInput" multiple accept=".pptx">
            <p>📁 Kéo thả file vào đây hoặc Click để chọn file</p>
        </div>

        <div id="file-list"></div>

        <button id="processBtn" class="btn-process" disabled>Xử lý File</button>

        <div id="result-area">
            <h3>Kết quả của bạn:</h3>
            <div id="download-links">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('file-list');
        const processBtn = document.getElementById('processBtn');
        const resultArea = document.getElementById('result-area');
        const downloadLinksContainer = document.getElementById('download-links');

        let selectedFiles = [];
        const EMU_TO_INCH = 914400; // Hằng số quy đổi tọa độ của Microsoft

        // 1. Lắng nghe chọn file
        fileInput.addEventListener('change', function (event) {
            selectedFiles = Array.from(event.target.files);
            fileListContainer.innerHTML = '';
            if (selectedFiles.length > 0) {
                const ul = document.createElement('ul');
                selectedFiles.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = `📄 ${file.name}`;
                    ul.appendChild(li);
                });
                fileListContainer.appendChild(ul);
                processBtn.disabled = false;
            } else {
                processBtn.disabled = true;
            }
            resultArea.style.display = 'none';
        });

        // Chỉ cần dùng JSZip, KHÔNG cần PptxGenJS nữa
        async function processSingleFile(file) {
            const zip = new JSZip();
            const arrayBuffer = await file.arrayBuffer();
            await zip.loadAsync(arrayBuffer);
            const parser = new DOMParser();
            const serializer = new XMLSerializer();

            // 1. Đọc các file cấu trúc lõi của PPTX để chuẩn bị cho việc xóa slide
            let presXmlStr = await zip.file("ppt/presentation.xml").async("string");
            let presDoc = parser.parseFromString(presXmlStr, "application/xml");

            let presRelsStr = await zip.file("ppt/_rels/presentation.xml.rels").async("string");
            let presRelsDoc = parser.parseFromString(presRelsStr, "application/xml");

            let contentTypesStr = await zip.file("[Content_Types].xml").async("string");
            let contentTypesDoc = parser.parseFromString(contentTypesStr, "application/xml");

            // Lấy danh sách tất cả các slide
            const slideFiles = Object.keys(zip.files).filter(name => name.match(/^ppt\/slides\/slide\d+\.xml$/));

            for (let slidePath of slideFiles) {
                let slideFileName = slidePath.split('/').pop(); // ví dụ: slide1.xml

                let slideXmlStr = await zip.file(slidePath).async("string");
                let slideDoc = parser.parseFromString(slideXmlStr, "application/xml");

                // ==========================================
                // BƯỚC 1: KIỂM TRA XEM SLIDE CÓ "ẢNH THẬT" KHÔNG
                // ==========================================
                let allBlips = slideDoc.getElementsByTagName("a:blip");
                if (allBlips.length === 0) allBlips = slideDoc.getElementsByTagNameNS("*", "blip");

                let hasValidImage = false;
                for (let i = 0; i < allBlips.length; i++) {
                    let curr = allBlips[i];
                    let isBackground = false;

                    // Truy ngược lên xem ảnh này có bị nằm trong thẻ nền (<p:bg>) không
                    while (curr) {
                        if (curr.nodeName === "p:bg" || (curr.nodeName && curr.nodeName.includes(":bg"))) {
                            isBackground = true;
                            break;
                        }
                        curr = curr.parentNode;
                    }

                    // Nếu có ít nhất 1 ảnh KHÔNG PHẢI là ảnh nền, thì đánh dấu là Slide hợp lệ
                    if (!isBackground) {
                        hasValidImage = true;
                        break;
                    }
                }

               if (!hasValidImage) {
                    // ==========================================
                    // BƯỚC 2A: KHÔNG CÓ ẢNH THẬT -> XÓA BỎ SLIDE TẬN GỐC (BẢN FIX TRIỆT ĐỂ)
                    // ==========================================
                    
                    // a. Tìm Relationship ID (rId) và xóa khỏi presentation.xml.rels
                    let rels = Array.from(presRelsDoc.getElementsByTagName("Relationship"));
                    if (rels.length === 0) rels = Array.from(presRelsDoc.getElementsByTagNameNS("*", "Relationship"));
                    
                    let rIdToRemove = null;
                    for (let rel of rels) {
                        let target = rel.getAttribute("Target");
                        // Bắt chính xác tên file ở đuôi chuỗi để không bị nhầm (vd: slide1.xml và slide11.xml)
                        if (target && (target.endsWith(`/${slideFileName}`) || target === slideFileName)) {
                            rIdToRemove = rel.getAttribute("Id");
                            rel.parentNode.removeChild(rel); 
                            break;
                        }
                    }

                    // b. Xóa thẻ <p:sldId> trong presentation.xml (Lý do gây ra trang trắng ở giữa)
                    if (rIdToRemove) {
                        let sldIds = Array.from(presDoc.getElementsByTagName("p:sldId"));
                        if (sldIds.length === 0) sldIds = Array.from(presDoc.getElementsByTagNameNS("*", "sldId"));
                        
                        for (let sldId of sldIds) {
                            let matchFound = false;
                            // Quét mọi thuộc tính, nếu giá trị trùng khớp rId thì đích thị là nó
                            for (let attr of sldId.attributes) {
                                if (attr.value === rIdToRemove) {
                                    matchFound = true;
                                    break;
                                }
                            }
                            if (matchFound) {
                                sldId.parentNode.removeChild(sldId);
                                break;
                            }
                        }
                    }

                    // c. Xóa khai báo trong [Content_Types].xml
                    let overrides = Array.from(contentTypesDoc.getElementsByTagName("Override"));
                    if (overrides.length === 0) overrides = Array.from(contentTypesDoc.getElementsByTagNameNS("*", "Override"));
                    
                    for (let override of overrides) {
                        let partName = override.getAttribute("PartName");
                        if (partName && partName.includes(slideFileName)) {
                            override.parentNode.removeChild(override);
                            break;
                        }
                    }

                    // d. Xóa file vật lý khỏi bộ nhớ RAM (file ZIP)
                    zip.remove(slidePath);
                    zip.remove(`ppt/slides/_rels/${slideFileName}.rels`);

                } else {
                    // ==========================================
                    // BƯỚC 2B: CÓ ẢNH -> XÓA CHỮ, GIỮ LẠI ẢNH VÀ ÉP NỀN TRẮNG
                    // ==========================================

                    // 1. Xóa các Shape chữ NHƯNG chừa lại Shape chứa ảnh
                    let shapes = Array.from(slideDoc.getElementsByTagName("p:sp"));
                    if (shapes.length === 0) shapes = Array.from(slideDoc.getElementsByTagNameNS("*", "sp"));

                    shapes.forEach(shape => {
                        // Kiểm tra xem shape có chứa hình ảnh (a:blipFill) không
                        let hasImageFill = shape.getElementsByTagName("a:blipFill").length > 0 ||
                            shape.getElementsByTagNameNS("*", "blipFill").length > 0;
                        if (!hasImageFill) {
                            shape.parentNode.removeChild(shape); // Xóa nếu chỉ là text/khối màu
                        }
                    });

                    // 2. Xóa các Biểu đồ, Bảng biểu (<p:graphicFrame>)
                    let graphics = Array.from(slideDoc.getElementsByTagName("p:graphicFrame"));
                    if (graphics.length === 0) graphics = Array.from(slideDoc.getElementsByTagNameNS("*", "graphicFrame"));
                    graphics.forEach(g => g.parentNode.removeChild(g));

                    // 3. Xóa các Đường kẻ nối (<p:cxnSp>)
                    let connectors = Array.from(slideDoc.getElementsByTagName("p:cxnSp"));
                    if (connectors.length === 0) connectors = Array.from(slideDoc.getElementsByTagNameNS("*", "cxnSp"));
                    connectors.forEach(c => c.parentNode.removeChild(c));

                    // 4. Xóa các nét vẽ bằng bút (Ink)
                    let inks = Array.from(slideDoc.getElementsByTagName("p:ink"));
                    if (inks.length === 0) inks = Array.from(slideDoc.getElementsByTagNameNS("*", "ink"));
                    inks.forEach(ink => ink.parentNode.removeChild(ink));

                    // 5. Tắt họa tiết Master Slide và Ép nền trắng (FFFFFFF)
                    slideDoc.documentElement.setAttribute("showMasterSp", "0");
                    let whiteBgXml = `
                    <p:bg xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
                        <p:bgPr>
                            <a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill>
                            <a:effectLst/>
                        </p:bgPr>
                    </p:bg>`;
                    let newBgDoc = parser.parseFromString(whiteBgXml, "application/xml");
                    let importedBgNode = slideDoc.importNode(newBgDoc.documentElement, true);

                    let cSld = slideDoc.getElementsByTagName("p:cSld")[0];
                    if (!cSld) cSld = slideDoc.getElementsByTagNameNS("*", "cSld")[0];

                    if (cSld) {
                        let oldBg = cSld.getElementsByTagName("p:bg")[0];
                        if (!oldBg) oldBg = cSld.getElementsByTagNameNS("*", "bg")[0];
                        if (oldBg) cSld.removeChild(oldBg);
                        cSld.insertBefore(importedBgNode, cSld.firstChild);
                    }

                    // Ghi đè file XML
                    let updatedSlideXml = serializer.serializeToString(slideDoc);
                    zip.file(slidePath, updatedSlideXml);
                }
            }

            // 2. Ghi đè các file hệ thống đã được cập nhật (sau khi xóa slide trống)
            zip.file("ppt/presentation.xml", serializer.serializeToString(presDoc));
            zip.file("ppt/_rels/presentation.xml.rels", serializer.serializeToString(presRelsDoc));
            zip.file("[Content_Types].xml", serializer.serializeToString(contentTypesDoc));

            // 3. Xuất file mới
            return await zip.generateAsync({
                type: "blob",
                mimeType: "application/vnd.openxmlformats-officedocument.presentationml.presentation"
            });
        }

        // 3. Xử lý khi bấm nút
        processBtn.addEventListener('click', async function () {
            processBtn.textContent = 'Đang xử lý...';
            processBtn.disabled = true;
            downloadLinksContainer.innerHTML = '';

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    let file = selectedFiles[i];

                    // Gọi hàm bóc tách cho từng file
                    let resultBlob = await processSingleFile(file);

                    // Tạo link download
                    const url = URL.createObjectURL(resultBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    // Thêm tiền tố để phân biệt với file gốc
                    a.download = `Images_${file.name}`;
                    a.className = 'download-btn';
                    a.textContent = `Tải về: Images_${file.name}`;
                    downloadLinksContainer.appendChild(a);
                }

                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Lỗi:", error);
                alert("Có lỗi xảy ra trong quá trình bóc tách hình ảnh!");
            } finally {
                processBtn.textContent = 'Xử lý File';
                processBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
